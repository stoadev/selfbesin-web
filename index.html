      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"

    <!-- Open Graph -->
    <meta property="og:site_name" content="Selfbesin" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Selfbesin – Besin Değerleri ve Kalori Takibi" />
    <meta property="og:description" content="Türkiye'nin en kapsamlı besin değerleri veritabanı. 10.000+ besinin kalori, protein, karbonhidrat ve yağ değerlerini anında öğren." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Selfbesin – Besin Değerleri ve Kalori Takibi" />

    <meta name="twitter:image" content="https://selfbesin.com/og-image.png" />

    <!-- Tema rengi -->
    <meta name="theme-color" content="#10b981" />
    <script>
      (function () {
        try {
          var localTheme = localStorage.getItem("theme");
          var supportDarkMode =
            window.matchMedia("(prefers-color-scheme: dark)").matches === true;
          if (
            localTheme === "dark" ||
            (localTheme !== "light" && !localTheme && supportDarkMode)
          ) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
